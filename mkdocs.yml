site_name: AI-Native Product Operations — Expertise Hub
site_description: A structured reference for AI-native product operations — architecture, data governance, security, sovereignty, and engineering practice.
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
  - attr_list

nav:
  - Home: index.md
  - AI Architecture:
      - Overview: domains/ai-architecture/index.md
      - Efficient Model Routing: domains/ai-architecture/model-routing.md
      - Vendor-Agnostic Development: domains/ai-architecture/vendor-agnostic-development.md
      - Multi-Vendor Strategy: domains/ai-architecture/multi-vendor-strategy.md
  - Data Governance:
      - Overview: domains/data-governance/index.md
      - Core Principles: domains/data-governance/core-principles.md
      - DAMA-DMBOK — The Wheel: domains/data-governance/dmbok-wheel.md
      - Operationalizing DMBOK: domains/data-governance/dmbok-operationalizing.md
      - Enterprise Metadata Model: domains/data-governance/enterprise-metadata-model.md
      - Metadata Management — Modern Practice: domains/data-governance/metadata-management.md
  - AI Security:
      - Overview: domains/ai-security/index.md
      - Guardrails: domains/ai-security/guardrails.md
  - Sovereignty & Infrastructure:
      - Overview: domains/sovereignty-infrastructure/index.md
      - Sovereign Infrastructure Buildout: domains/sovereignty-infrastructure/sovereign-infrastructure.md
      - Mistral AI: domains/sovereignty-infrastructure/mistral-ai.md
  - Lean & Engineering:
      - Overview: domains/lean-engineering/index.md
      - Lean AI-Assisted Org: domains/lean-engineering/lean-ai-org.md
      - CI-by-Design: domains/lean-engineering/ci-by-design.md
  - Playbooks:
      - Overview: playbooks/index.md
      - DMBOK Operationalization: playbooks/dmbok-operationalization.md
      - Active Metadata Practice: playbooks/active-metadata-practice.md
      - CI-by-Design: playbooks/ci-by-design.md
      - AI Eval Containment: playbooks/ai-eval-containment.md
      - AI Product Alignment & Review:
          - Overview: playbooks/ai-product-alignment/index.md
          - Security & Resilience Non-Negotiables: playbooks/ai-product-alignment/security-resilience.md
          - Human-in-the-Loop Threshold: playbooks/ai-product-alignment/human-in-the-loop.md
          - "Stage 1 — Discovery & Framing": playbooks/ai-product-alignment/stage-1-discovery.md
          - "Stage 2 — Data & Model Design": playbooks/ai-product-alignment/stage-2-data-model-design.md
          - "Stage 3 — Build & Integration": playbooks/ai-product-alignment/stage-3-build-integration.md
          - "Stage 4 — Evaluation & Governance Review": playbooks/ai-product-alignment/stage-4-governance-review.md
          - "Stage 5 — Launch & Rollout": playbooks/ai-product-alignment/stage-5-launch-rollout.md
          - "Stage 6 — Operate & Monitor": playbooks/ai-product-alignment/stage-6-operate-monitor.md
  - Reference:
      - Glossary: reference/glossary.md
      - Legal & Regulatory: reference/legal-regulatory.md
      - Case Studies: reference/case-studies.md
      - Experts & Sources: reference/experts.md
      - Landscape: reference/landscape.md
      - Tags: reference/tags.md
