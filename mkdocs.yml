          - "Stage 1 — Discovery & Framing": playbooks/ai-product-alignment/stage-1-discovery.md
          - "Stage 2 — Data & Model Design": playbooks/ai-product-alignment/stage-2-data-model-design.md
          - "Stage 3 — Build & Integration": playbooks/ai-product-alignment/stage-3-build-integration.md
          - "Stage 4 — Evaluation & Governance Review": playbooks/ai-product-alignment/stage-4-governance-review.md
