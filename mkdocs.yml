site_name: AI Architecture — Expertise Hub
site_description: Personal learning foundation for enterprise AI architecture, product ops, and data governance.
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
  - attr_list

nav:
  - Home: index.md
  - AI Architecture:
      - Overview: domains/ai-architecture/index.md
      - Efficient Model Routing: domains/ai-architecture/model-routing.md
      - Vendor-Agnostic Development: domains/ai-architecture/vendor-agnostic-development.md
      - Multi-Vendor Strategy: domains/ai-architecture/multi-vendor-strategy.md
  - Data Governance:
      - Overview: domains/data-governance/index.md
      - Core Principles: domains/data-governance/core-principles.md
      - DAMA-DMBOK — The Wheel: domains/data-governance/dmbok-wheel.md
      - Operationalizing DMBOK: domains/data-governance/dmbok-operationalizing.md
      - Enterprise Metadata Model: domains/data-governance/enterprise-metadata-model.md
  - AI Security:
      - Overview: domains/ai-security/index.md
      - Guardrails: domains/ai-security/guardrails.md
  - Sovereignty & Infrastructure:
      - Overview: domains/sovereignty-infrastructure/index.md
      - Sovereign Infrastructure Buildout: domains/sovereignty-infrastructure/sovereign-infrastructure.md
      - Mistral AI: domains/sovereignty-infrastructure/mistral-ai.md
  - Lean & Engineering:
      - Overview: domains/lean-engineering/index.md
      - Lean AI-Assisted Org: domains/lean-engineering/lean-ai-org.md
      - CI-by-Design: domains/lean-engineering/ci-by-design.md
  - Reference:
      - Glossary: reference/glossary.md
      - Legal & Regulatory: reference/legal-regulatory.md
      - Experts & Sources: reference/experts.md
      - Landscape: reference/landscape.md
      - Tags: reference/tags.md
