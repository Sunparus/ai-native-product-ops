site_name: AI-Native Product Operations — Expertise Hub
site_description: A structured reference for AI-native product operations — architecture, data governance, security, sovereignty, and engineering practice.
repo_url: https://github.com/Sunparus/ai-native-product-ops
repo_name: ai-native-product-ops
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: amber
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
  - attr_list

nav:
  - Home: index.md
  - AI/ML Systems Engineering:
      - Overview: domains/ai-ml-systems-engineering/index.md
      - Efficient Model Routing: domains/ai-ml-systems-engineering/model-routing.md
      - Vendor-Agnostic Development: domains/ai-ml-systems-engineering/vendor-agnostic-development.md
      - Multi-Vendor Strategy: domains/ai-ml-systems-engineering/multi-vendor-strategy.md
  - Evaluation & Observability:
      - Overview: domains/evaluation-observability/index.md
  - Data Governance:
      - Overview: domains/data-governance/index.md
      - Core Principles: domains/data-governance/core-principles.md
      - DAMA-DMBOK — The Wheel: domains/data-governance/dmbok-wheel.md
      - Operationalizing DMBOK: domains/data-governance/dmbok-operationalizing.md
      - Enterprise Metadata Model: domains/data-governance/enterprise-metadata-model.md
      - Metadata Management — Modern Practice: domains/data-governance/metadata-management.md
  - AI Security & Risk:
      - Overview: domains/ai-security-risk/index.md
      - Guardrails: domains/ai-security-risk/guardrails.md
      - Sovereign Infrastructure Buildout: domains/ai-security-risk/sovereign-infrastructure.md
      - Mistral AI: domains/ai-security-risk/mistral-ai.md
      - Ethics & Bias: domains/ai-security-risk/ethics-bias.md
  - Delivery & Operating Practice:
